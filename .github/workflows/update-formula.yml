# Generic formula updater — triggered via repository_dispatch from any package repo.
# Payload: { formula_name: "agent-toolkit", version: "1.0.0" }
# Or: workflow_dispatch with formula_name and version inputs.
name: Update Formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      formula_name:
        description: Formula name (e.g. agent-toolkit)
        required: true
      version:
        description: New version (e.g. 1.0.0)
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT with repo scope — GITHUB_TOKEN cannot push from this workflow
          # when the default token lacks write (repository_dispatch + env).
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Resolve inputs
        id: inputs
        run: |
          FORMULA_NAME="${{ github.event.client_payload.formula_name || github.event.inputs.formula_name }}"
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          echo "formula_name=$FORMULA_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Formula: $FORMULA_NAME  Version: $VERSION"

      - name: Determine source URL and fetch checksum
        id: source
        run: |
          FORMULA="${{ steps.inputs.outputs.formula_name }}"
          VERSION="${{ steps.inputs.outputs.version }}"

          # Read current formula to detect source type (GitHub release vs PyPI vs npm)
          FORMULA_FILE="Formula/${FORMULA}.rb"
          if [ ! -f "$FORMULA_FILE" ]; then
            echo "::error::Formula not found: $FORMULA_FILE"
            exit 1
          fi

          # Detect source type from current URL pattern
          CURRENT_URL=$(grep -E '^\s+url "' "$FORMULA_FILE" | head -1 | sed 's/.*url "//; s/".*//')
          echo "Current URL pattern: $CURRENT_URL"

          if echo "$CURRENT_URL" | grep -q "github.com"; then
            # GitHub release tarball
            URL="https://github.com/ulises-jeremias/${FORMULA}/archive/refs/tags/v${VERSION}.tar.gz"
          elif echo "$CURRENT_URL" | grep -q "pypi"; then
            # PyPI
            PYPI_NAME=$(echo "$FORMULA" | tr '-' '_')
            URL="https://files.pythonhosted.org/packages/source/${PYPI_NAME:0:1}/${PYPI_NAME}/${PYPI_NAME}-${VERSION}.tar.gz"
          elif echo "$CURRENT_URL" | grep -q "registry.npmjs.org"; then
            # npm
            URL="https://registry.npmjs.org/${FORMULA}/-/${FORMULA}-${VERSION}.tgz"
          else
            echo "::error::Cannot detect source type from URL: $CURRENT_URL"
            exit 1
          fi

          echo "New URL: $URL"

          # Fetch tarball and compute SHA256 (retry up to 24 times, 15s apart)
          SHA256=""
          for attempt in $(seq 1 24); do
            echo "Attempt $attempt/24: downloading tarball..."
            if curl -fsSL --retry 3 "$URL" -o /tmp/pkg.tar.gz 2>/dev/null; then
              SHA256=$(sha256sum /tmp/pkg.tar.gz | awk '{print $1}')
              # Guard against empty file
              EMPTY_SHA="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              if [ "$SHA256" != "$EMPTY_SHA" ] && [ -n "$SHA256" ]; then
                echo "SHA256: $SHA256"
                break
              fi
            fi
            if [ "$attempt" = "24" ]; then echo "::error::Failed after 24 attempts"; exit 1; fi
            echo "::warning::Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Patch formula
        run: |
          FORMULA_FILE="Formula/${{ steps.inputs.outputs.formula_name }}.rb"
          VERSION="${{ steps.inputs.outputs.version }}"
          URL="${{ steps.source.outputs.url }}"
          SHA256="${{ steps.source.outputs.sha256 }}"

          # Replace url line
          sed -i "s|url \".*\"|url \"$URL\"|" "$FORMULA_FILE"
          # Replace sha256 line
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|" "$FORMULA_FILE"

          echo "Updated $FORMULA_FILE:"
          grep -E '^\s+(url|sha256) "' "$FORMULA_FILE"

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(${{ steps.inputs.outputs.formula_name }}): update to v${{ steps.inputs.outputs.version }}"
          commit_user_name: "ulises-jeremias-bot"
          commit_user_email: "ulisescf.24@gmail.com"
          file_pattern: "Formula/*.rb"
